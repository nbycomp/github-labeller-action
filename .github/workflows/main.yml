on: [pull_request]

jobs:
  labeller:
    runs-on: ubuntu-latest
    name: A job to set the PR label based on the branch name
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Action step
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: "feature, bugfix, build, ci, documentation,
          test, performance, style, uncategorised,
          internal, refactor"
